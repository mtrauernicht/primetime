# ==============================================================================
# ============================ Config file  ====================================
# ==============================================================================

#===============================================================================
# ============================= Input and Output ===============================
COMPARISONS_FILE: /DATA/shared/projects/TF_REPORTERS/prime_TF_reporters/E2951_indiv_HCT_test/mt20260707_comparisons.txt
SAMPLES_FILE: /DATA/shared/projects/TF_REPORTERS/prime_TF_reporters/E2951_indiv_HCT_test/mt20260707_conditions_to_file.txt
OUTPUT_DIRECTORY: /DATA/shared/projects/TF_REPORTERS/prime_TF_reporters/E2951_indiv_HCT_test/001_OUTPUT


# ==============================================================================
# ============================ Pipeline parameters =============================
PVALUE_THRESHOLD: 0.01

SPLIT_COMPARATIVE_ANALYSIS_BY_PROMOTER: False

NORMALIZE_COUNTS: True



# ==============================================================================
# ============================ Library parameters ==============================
# Number of barcodes per TF
BARCODES_PER_TF: 5

# Length of the barcodes
BARCODE_LENGTH: 12

# BC downstream sequence: this will be used to identify the barcodes in the fastq files
BARCODE_DOWNSTREAM_SEQUENCE: CATCGTCGCATCCAAGAGGC 

# How many mismatches are allowed in the downstream sequence to identify the barcode?
MAX_MISMATCH_DOWNSTREAM_SEQ: 3

# Path to the barcode annotation file
BARCODE_ANNOTATION_FILE: /DATA/pipelines/primetime/misc/bc_annotation_prime_v2.csv

# Path to expected pDNA counts, to compare with as a QC
EXPECTED_PDNA_COUNTS: /DATA/pipelines/primetime/misc/expected_pDNA_counts.txt