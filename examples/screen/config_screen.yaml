################################################################################
# Primetime: TF reporter pipeline -- EXAMPLE config for Snakefile_screen (K562 drug-screen subset)
# Vinícius H. Franceschini-Santos, Max Trauernicht
# ==============================================================================
# ============================ Config file  ====================================
# ==============================================================================
# Run from this directory (all paths are relative to it):
#   snakemake --configfile config_screen.yaml -s ../../Snakefile_screen --cores 8

#===============================================================================
# ============================= Input and Output ===============================
## Which plates should be processed? Tab-separated file with, per plate: plate_id,
## path to the plate's fastq (or pDNA fastq), and (for every non-pDNA plate) the path to
## that plate's own well specification (well,sample[,replicate_id] CSV).
## The 3rd (optional) column of that CSV is a stable replicate ID that, combined with the
## plate ID, becomes the final replicate ID (e.g. sample "DMSO", plate "K562_TEST" -> "DMSO_K562_TEST_1").
## In this example the plate FASTQ is only a placeholder: reads are already demultiplexed.
PLATES_FILE: plates_to_file.txt
## Directory with demultiplexed fastqs named <plate_id>_<well>.fastq.gz
DEMULTIPLEX_DIRECTORY: demultiplexed_fastq
## Which comparisons should be performed? (ref_condition<TAB>test_condition1<TAB>test_condition2...)
COMPARISONS_FILE: comparisons.txt
## Where should the output be saved?
OUTPUT_DIRECTORY: OUTPUT


# ==============================================================================
# ============================ Pipeline parameters =============================
# Adjusted p-value threshold for calling a TF differentially active
PVALUE_THRESHOLD: 0.05

# Normalize counts to the RANDOM control reporters to account for differences in baseline activity
NORMALIZE_COUNTS: True
# Normalization is count-level: counts are scaled per promoter and replicate using the RANDOM reporters before BCalm

# Banana-shaped bias correction of contrast vs reference barcode counts (to get rid of pDNA bleed-through)
BANANA_CORRECTION: True
# Banana correction is done per comparison: the number of replicates of the reference condition with the
# lowest pDNA bleed-through used as anchor (the others and the contrast are corrected against their mean).
# Use 0 for all replicates of the reference condition.
BANANA_REFERENCE_N: 3

# Correct cDNA counts for sequencing-depth-dependent biases (separately per TF)
DEPTH_NORMALIZATION: True

# Correct barcode-specific offsets to sample median
BARCODE_OFFSET_CORRECTION: True

# Exclude cDNA replicates with fewer than this many reads (0 = keep all). Comparisons that lose all
# replicates of a condition get empty outputs.
MIN_READS_PER_REPLICATE: 15000

# Exclude cDNA replicates above this pre-barcode-filter bleed-through fraction (0.5 = 50%); -1 disables.
MAX_BLEEDTHROUGH: 0.5

# Report empirical-Bayes shrunken logFC (after BCalm; p-values stay unshrunk)
SHRINKAGE: True

# Set to False to skip demultiplexing and use the existing demultiplexed FASTQ files
# from DEMULTIPLEX_DIRECTORY (the case for this example).
RUN_DEMULTIPLEXING: False

# Optional: when True, read annotated barcode files directly from PREVIOUS_TMP_PRIMETIME_DIR
# and skip recomputing barcode counting/clustering/annotation. Not used in this example.
REUSE_PREVIOUS_BC_COUNTS: False


# ==============================================================================
# ============================ Library parameters ==============================
# Number of barcodes per TF
BARCODES_PER_TF: 5

# Length of the barcodes
BARCODE_LENGTH: 12

# BC downstream sequence: this will be used to identify the barcodes in the fastq files
BARCODE_DOWNSTREAM_SEQUENCE: CATCGTCGCATCCAAGAGGC
# Sequence upstream of the RT barcode (only used when demultiplexing)
RT_BARCODE_UPSTREAM_SEQUENCE: CATCGTCGCATCCAAGAGGC

# How many mismatches are allowed in the downstream sequence to identify the barcode?
MAX_MISMATCH_DOWNSTREAM_SEQ: 3


# ==============================================================================
# ============================ Other input files ===============================
# Path to the barcode annotation file
BARCODE_ANNOTATION_FILE: ../../misc/bc_annotation_prime_v2.csv

# Path to expected pDNA counts, to compare with as a QC
EXPECTED_PDNA_COUNTS: ../../misc/expected_pDNA_counts.txt

# Path to RT barcode to well mapping file
RT_BARCODE_MAPPING_FILE: ../../misc/rt_barcode.csv

# Optional viability matrix file or list of files, in plate order; leave empty to skip the QC plots
VIABILITY_FILE: ""
