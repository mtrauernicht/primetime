################################################################################
# Primetime: TF reporter pipeline -- EXAMPLE config for Snakefile (DOT1L WT vs KO)
# Vinícius H. Franceschini-Santos, Max Trauernicht
# ==============================================================================
# ============================ Config file  ====================================
# ==============================================================================
# Run from this directory (all paths are relative to it):
#   snakemake --configfile config.yaml -s ../../Snakefile --cores 8

#===============================================================================
# ============================= Input and Output ===============================
## Which comparisons should be performed? (ref_condition<TAB>test_condition1<TAB>test_condition2...)
COMPARISONS_FILE: comparisons.txt
## Tab-separated: condition<TAB>path to fastq. Replicates are conditions listed on several lines;
## the pDNA library must be listed as condition "pDNA".
SAMPLES_FILE: samples.txt
## Where should the output be saved?
OUTPUT_DIRECTORY: OUTPUT


# ==============================================================================
# ============================ Pipeline parameters =============================
# Adjusted p-value threshold for calling a TF differentially active
PVALUE_THRESHOLD: 0.01

# Normalize counts to the RANDOM control reporters to account for differences in baseline activity
NORMALIZE_COUNTS: True
# Normalization is count-level: counts are scaled per promoter and replicate using the RANDOM reporters before BCalm

# Set to False to skip the banana-shaped bias correction of contrast vs reference barcode counts
# (corrects for pDNA bleed-through)
BANANA_CORRECTION: True
# Banana correction is done per comparison: the number of replicates of the reference condition with the
# lowest pDNA bleed-through used as anchor (the others and the contrast are corrected against their mean).
# Use 0 for all replicates of the reference condition.
BANANA_REFERENCE_N: 1

# Add empirical-Bayes shrunken logFC values after BCalm
# (p-values and significance calls remain based on unshrunk logFC).
SHRINKAGE: True

# Exclude cDNA replicates with fewer than this many reads (0 = keep all). Comparisons that lose all
# replicates of a condition get empty outputs.
MIN_READS_PER_REPLICATE: 15000

# Exclude cDNA replicates above this pre-barcode-filter bleed-through fraction (0.5 = 50%); -1 disables.
# (Not set here, so the pipeline default of 0.5 applies.)
# MAX_BLEEDTHROUGH: 0.5


# ==============================================================================
# ============================ Library parameters ==============================
# Number of barcodes per TF
BARCODES_PER_TF: 5

# Length of the barcodes
BARCODE_LENGTH: 12

# BC downstream sequence: this will be used to identify the barcodes in the fastq files
BARCODE_DOWNSTREAM_SEQUENCE: CATCGTCGCATCCAAGAGGCTAGCTAACTA

# How many mismatches are allowed in the downstream sequence to identify the barcode?
MAX_MISMATCH_DOWNSTREAM_SEQ: 3


# ==============================================================================
# ============================ Other input files ===============================
# Path to the barcode annotation file
BARCODE_ANNOTATION_FILE: ../../misc/bc_annotation_prime_v2.csv

# Path to expected pDNA counts, to compare with as a QC
EXPECTED_PDNA_COUNTS: ../../misc/expected_pDNA_counts.txt
