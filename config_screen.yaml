# ==============================================================================
# ============================ Config file  ====================================
# ==============================================================================

#===============================================================================
# ============================= Input and Output ===============================
## Which plates should be processed? Tab-separated file with, per plate: plate_id,
## path to the plate's read1/2 fastq (or pDNA fastq), and (for every non-pDNA plate)
## the path to that plate's own SAMPLES_FILE (well,sample[,replicate_id] CSV).
## Each plate can have its own SAMPLES_FILE, so a sample/condition can be present on
## one plate but absent on another; the 3rd (optional) column of SAMPLES_FILE is a
## stable replicate/well ID (e.g. "2") that, combined with the plate ID, becomes the
## final replicate ID (e.g. sample "DMSO" on plate "U2OS" -> "DMSO_U2OS_2").
## Example PLATES_FILE row: U2OS<TAB>/path/to/U2OS_R2.fastq.gz<TAB>/path/to/U2OS_samples.csv
PLATES_FILE: /DATA/pipelines/primetime/testing_E2904/mt20260112_plates_to_file.txt
DEMULTIPLEX_DIRECTORY: /shared/gcf/m.trauernicht/shared/h.yucel/8507/NOVA441_fastq_files/demultiplex
## Which comparisons should be performed? (ref_condition<TAB>test_condition1<TAB>test_condition2...)
COMPARISONS_FILE: /DATA/pipelines/primetime/testing_E2904/mt20260112_comparisons.txt
## Where should the output be saved?
OUTPUT_DIRECTORY: /DATA/pipelines/primetime/testing_E2904/001_OUTPUT_screen_testing
      
# ==============================================================================
# ============================ Pipeline parameters =============================
PVALUE_THRESHOLD: 0.01

# should the counts be normalized to the random controls to account for differences in baseline activity
NORMALIZE_COUNTS: True
# Normalization is count-level: counts are scaled per promoter and replicate using the RANDOM reporters before BCalm

# banana-shaped bias correction of contrast vs reference barcode counts (to get rid of pDNA bleedthrough)
BANANA_CORRECTION: True
# Banana correction is done per comparison: the number of replicates of the reference condition with the
# lowest pDNA bleed-through used as anchor (the others and the contrast are corrected against their mean).
# Use 0 for all replicates of the reference condition.
BANANA_REFERENCE_N: 3

# correct cDNA counts for sequencing-depth-dependent biases (separately per TF)
DEPTH_NORMALIZATION: True

# correct barcode-specific offsets to sample median
BARCODE_OFFSET_CORRECTION: True

# Exclude cDNA replicates with fewer than this many reads (0 = keep all). Comparisons that lose all
# replicates of a condition get empty outputs.
MIN_READS_PER_REPLICATE: 0

# Exclude cDNA replicates above this pre-barcode-filter bleed-through fraction (0.5 = 50%); -1 disables.
MAX_BLEEDTHROUGH: 0.5

# report empirical-Bayes shrunken logFC (after BCalm; p-values stay unshrunk)
SHRINKAGE: True

# Set to False to skip demultiplexing and reuse existing demultiplexed FASTQ files
# from DEMULTIPLEX_DIRECTORY.
RUN_DEMULTIPLEXING: True


# Optional: when True, read annotated barcode files directly from
# PREVIOUS_TMP_PRIMETIME_DIR/tmp_primetime/bc_counts and skip recomputing
# get_barcode_counts/cluster_barcodes/annotate_barcodes.
REUSE_PREVIOUS_BC_COUNTS: False

# If true, set directory, Examples:
# PREVIOUS_TMP_PRIMETIME_DIR: /path/to/old_run_output
# PREVIOUS_TMP_PRIMETIME_DIR: /path/to/old_run_output/tmp_primetime
PREVIOUS_TMP_PRIMETIME_DIR: ""



# ==============================================================================
# ============================ Library parameters ==============================
# Number of barcodes per TF
BARCODES_PER_TF: 5

# Length of the barcodes
BARCODE_LENGTH: 12

# BC downstream sequence: this will be used to identify the barcodes in the fastq files
BARCODE_DOWNSTREAM_SEQUENCE: CATCGTCGCATCCAAGAGGC
RT_BARCODE_UPSTREAM_SEQUENCE: CATCGTCGCATCCAAGAGGC

# How many mismatches are allowed in the downstream sequence to identify the barcode?
MAX_MISMATCH_DOWNSTREAM_SEQ: 3


# ==============================================================================
# ============================ Other input files ===============================
# Path to the barcode annotation file
BARCODE_ANNOTATION_FILE: /DATA/pipelines/primetime/misc/bc_annotation_prime_v2.csv

# Path to expected pDNA counts, to compare with as a QC
EXPECTED_PDNA_COUNTS: /DATA/pipelines/primetime/misc/expected_pDNA_counts.txt

# Path to RT barcode to well mapping file
RT_BARCODE_MAPPING_FILE: /DATA/pipelines/primetime/misc/rt_barcode.csv

# Optional viability matrix file or list of files, in plate order; leave empty to skip the QC plots
VIABILITY_FILE: ""